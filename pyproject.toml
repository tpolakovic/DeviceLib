[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devicelib"
version = "0.1.0"
description = "Library for quick design of superconducting device chips, built on PHIDL"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "phidl>=1.6",
    "numpy",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]
# phidl's polygon rasterization (used by devicelib.fill.hex_hole_array)
fill = [
    "scikit-image",
]

[project.urls]
Homepage = "https://github.com/tpolakovic/DeviceLib"

[tool.setuptools]
packages = ["devicelib"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
